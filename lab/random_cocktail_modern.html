<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mix Tonight — 随机调酒</title>
<script>if(new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embedded');</script>
<style>
:root{
  --bg:#0b0d12;--panel:rgba(255,255,255,.065);--panel2:rgba(255,255,255,.035);
  --text:#f7f7f4;--muted:#9ea3ad;--line:rgba(255,255,255,.10);
  --lime:#d8ff72;--orange:#ff8b5c;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  background:
    radial-gradient(circle at 15% 10%,rgba(216,255,114,.10),transparent 30rem),
    radial-gradient(circle at 85% 75%,rgba(255,139,92,.08),transparent 32rem),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:48px 48px;
}
.app{width:min(1120px,calc(100% - 32px));margin:auto;padding:30px 0 60px}
nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:68px}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em}
.logo i{width:32px;height:32px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:#111;font-style:normal}
nav .back-link{color:var(--muted);font-size:13px;text-decoration:none} nav .back-link:hover{color:var(--text)} nav .back-link:focus-visible{outline:2px solid var(--lime);outline-offset:5px}
nav .hint{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center}
.kicker{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{font-size:clamp(52px,7vw,92px);line-height:.93;letter-spacing:-.065em;margin:16px 0 24px;font-weight:760}
.intro{color:var(--muted);font-size:16px;line-height:1.8;max-width:560px}
.controls{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
select,button{
  border:1px solid var(--line);border-radius:14px;padding:13px 16px;
  background:var(--panel);color:var(--text);font:inherit;outline:none
}
select{min-width:138px}
button{cursor:pointer;background:var(--lime);color:#10120d;border-color:var(--lime);font-weight:800;padding-inline:22px;transition:.18s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(216,255,114,.14)}
.card{
  position:relative;overflow:hidden;min-height:520px;border:1px solid var(--line);border-radius:30px;
  padding:30px;background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
  box-shadow:0 35px 100px rgba(0,0,0,.28);backdrop-filter:blur(16px)
}
.card:after{
  content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-100px;top:-100px;
  background:var(--glow,var(--lime));filter:blur(70px);opacity:.18
}
.topline{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.number{color:var(--muted);font-size:12px;letter-spacing:.1em}
.badge{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.15)}
.visual{height:190px;display:grid;place-items:center;font-size:110px;filter:drop-shadow(0 22px 28px rgba(0,0,0,.32));transition:.2s}
.card.flash .visual{transform:scale(.92) rotate(-4deg);opacity:.3}
.base{font-size:11px;color:var(--lime);letter-spacing:.14em;font-weight:800;text-transform:uppercase}
h2{font-size:40px;letter-spacing:-.04em;margin:7px 0 2px}
.en{color:var(--muted);font-size:14px}
.tags{display:flex;gap:7px;margin-top:15px;flex-wrap:wrap}
.tag{font-size:11px;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:#d7d9de}
.details{margin-top:28px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:25px;padding-top:22px}
.details h3{font-size:10px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;margin:0 0 11px}
ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.9}
.method{font-size:13px;color:#c6c8cd;line-height:1.75}
.tip{margin-top:55px;border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;color:#717782;font-size:12px}
@media(max-width:820px){
 nav{margin-bottom:42px}.hero{grid-template-columns:1fr;gap:40px}.intro{max-width:none}.card{min-height:500px}.tip{gap:20px;flex-direction:column}
}
@media(max-width:520px){.app{width:min(100% - 22px,1120px)}nav .hint{display:none}.controls>*{flex:1}.controls button{flex-basis:100%}.card{padding:22px;border-radius:24px}.details{grid-template-columns:1fr}.visual{height:150px;font-size:88px}h2{font-size:34px}}
html.embedded body{min-height:0}
html.embedded .app{width:min(100% - 24px,1120px);padding:24px 0}
html.embedded nav{display:none}
html.embedded h1{font-size:clamp(42px,7vw,72px)}
html.embedded .tip{margin-top:28px}
</style>
</head>
<body>
<main class="app">
<nav><a class="back-link" href="/post/20260814调酒入门/" target="_top">← 返回调酒文章</a><div class="logo"><i>✦</i>MIX TONIGHT</div><div class="hint">Cocktail Randomizer · 适量饮酒</div></nav>
<section class="hero">
  <div>
    <div class="kicker">Find your drink</div>
    <h1>今晚<br>喝什么？</h1>
    <p class="intro">不知道调什么，就交给随机数。选择你想喝的基酒与风格，生成一杯今晚的鸡尾酒。</p>
    <div class="controls">
      <select id="base" aria-label="基酒">
        <option value="all">所有基酒</option><option>金酒</option><option>伏特加</option><option>威士忌</option><option>朗姆酒</option><option>龙舌兰</option><option>白兰地</option><option>其他</option>
      </select>
      <select id="style" aria-label="风格">
        <option value="all">所有风格</option><option>清爽</option><option>酸甜</option><option>酒感</option><option>苦甜</option><option>热带</option>
      </select>
      <button id="roll">🎲 换一杯</button>
    </div>
  </div>
  <article class="card" id="card">
    <div class="topline"><span class="number">TONIGHT'S PICK</span><span class="badge" id="badge">GIN</span></div>
    <div class="visual" id="emoji">🍸</div>
    <div class="base" id="baseName">GIN · 金酒</div>
    <h2 id="name">金汤力</h2><div class="en" id="en">Gin & Tonic</div>
    <div class="tags" id="tags"></div>
    <div class="details">
      <div><h3>Ingredients</h3><ul id="ingredients"></ul></div>
      <div><h3>Method</h3><div class="method" id="method"></div></div>
    </div>
  </article>
</section>
<div class="tip"><span>配方为家庭调酒参考，可按口味调整甜度、酸度与稀释度。</span><span>DRINK RESPONSIBLY · 适量饮酒</span></div>
</main>
<script>
const drinks=[
{name:"金汤力",en:"Gin & Tonic",base:"金酒",code:"GIN",style:["清爽"],emoji:"🍸",i:["金酒 25 ml","汤力水 75 ml","青柠角"],m:"杯中加满冰，倒入金酒，再缓慢加入汤力水。轻搅，挤入青柠角。"},
{name:"尼格罗尼",en:"Negroni",base:"金酒",code:"GIN",style:["苦甜","酒感"],emoji:"🥃",i:["金酒 33 ml","甜味美思 33 ml","金巴利 33 ml","橙皮"],m:"加冰搅拌至充分冰镇，滤入装有大冰块的杯中，以橙皮增香。"},
{name:"马天尼",en:"Martini",base:"金酒",code:"GIN",style:["酒感"],emoji:"🍸",i:["金酒 75 ml","干味美思 25 ml","柠檬皮 / 橄榄"],m:"所有酒液加冰搅拌，滤入预冷杯。用柠檬皮或橄榄装饰。"},
{name:"螺丝刀",en:"Screwdriver",base:"伏特加",code:"VODKA",style:["清爽","酸甜"],emoji:"🍊",i:["伏特加 25 ml","橙汁 75 ml","橙片"],m:"高球杯加冰，加入伏特加与橙汁，轻轻搅匀。"},
{name:"威士忌酸",en:"Whiskey Sour",base:"威士忌",code:"WHISKY",style:["酸甜"],emoji:"🥃",i:["波本 50 ml","黄柠汁 25 ml","单糖浆 25 ml","可选：蛋清"],m:"加入摇壶充分摇荡；使用蛋清时可先无冰干摇，再加冰摇。滤入杯中。"},
{name:"古典",en:"Old Fashioned",base:"威士忌",code:"WHISKY",style:["酒感","苦甜"],emoji:"🥃",i:["威士忌 60 ml","方糖 1 块","苦精 3 滴","少量水","橙皮"],m:"杯中将糖、苦精和少量水混合，加入威士忌与大冰块，缓慢搅拌冰镇。"},
{name:"莫吉托",en:"Mojito",base:"朗姆酒",code:"RUM",style:["清爽"],emoji:"🌿",i:["白朗姆 40 ml","青柠汁 20 ml","糖 / 薄荷","苏打水约 40 ml"],m:"轻拍薄荷，与青柠和糖加入杯中，加冰与朗姆，补苏打水并轻搅。"},
{name:"代基里",en:"Daiquiri",base:"朗姆酒",code:"RUM",style:["酸甜"],emoji:"🍸",i:["白朗姆 50 ml","青柠汁 33 ml","单糖浆 17 ml"],m:"所有材料加冰快速摇荡，滤入预冷杯。"},
{name:"椰林飘香",en:"Piña Colada",base:"朗姆酒",code:"RUM",style:["热带","酸甜"],emoji:"🍍",i:["白朗姆 25 ml","椰浆 25 ml","菠萝汁 50 ml"],m:"材料与冰充分摇匀或搅打，倒入大杯，以菠萝装饰。"},
{name:"玛格丽特",en:"Margarita",base:"龙舌兰",code:"TEQUILA",style:["酸甜","清爽"],emoji:"🌵",i:["龙舌兰 50 ml","君度 25 ml","青柠汁 25 ml","盐边"],m:"杯口做盐边。其余材料加冰摇荡，滤入预冷杯。"},
{name:"边车",en:"Sidecar",base:"白兰地",code:"BRANDY",style:["酸甜"],emoji:"🍸",i:["白兰地 50 ml","君度 25 ml","柠檬汁 25 ml"],m:"材料加冰摇荡，滤入预冷杯，以柠檬皮或橙皮增香。"},
{name:"金巴利苏打",en:"Campari & Soda",base:"其他",code:"APERITIF",style:["苦甜","清爽"],emoji:"🍹",i:["金巴利 33 ml","苏打水 67 ml","橙片"],m:"杯中加冰，倒入金巴利并补苏打水，轻搅，以橙片装饰。"}
];
let previous="";
const $=id=>document.getElementById(id);
function roll(){
 const b=$("base").value,s=$("style").value;
 let pool=drinks.filter(d=>(b==="all"||d.base===b)&&(s==="all"||d.style.includes(s)));
 if(!pool.length) pool=drinks.filter(d=>(b==="all"||d.base===b)||(s==="all"||d.style.includes(s)));
 if(pool.length>1) pool=pool.filter(d=>d.name!==previous);
 const d=pool[Math.floor(Math.random()*pool.length)]||drinks[0]; previous=d.name;
 $("card").classList.add("flash");
 setTimeout(()=>{
  $("emoji").textContent=d.emoji;$("badge").textContent=d.code;
  $("baseName").textContent=d.code+" · "+d.base;$("name").textContent=d.name;$("en").textContent=d.en;
  $("tags").innerHTML=d.style.map(x=>`<span class="tag">${x}</span>`).join("");
  $("ingredients").innerHTML=d.i.map(x=>`<li>${x}</li>`).join("");
  $("method").textContent=d.m;$("card").classList.remove("flash");
 },130);
}
$("roll").addEventListener("click",roll);
$("base").addEventListener("change",roll);$("style").addEventListener("change",roll);
roll();
if(document.documentElement.classList.contains("embedded")&&window.parent!==window){
 const app=document.querySelector(".app");
 const reportHeight=()=>window.parent.postMessage({type:"mix-tonight-height",height:Math.ceil(app.getBoundingClientRect().height)},location.origin);
 new ResizeObserver(reportHeight).observe(app);
 window.addEventListener("load",reportHeight);
}
</script>
</body>
</html>
